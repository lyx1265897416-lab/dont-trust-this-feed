<style>
/* One 9:16 screen. Everything text-like sits on the video as HTML, because the footage itself never contains readable text. */

.src{display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:#eef2f2;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:6px 9px}

.icon svg{width:18px;height:18px;display:block}

  const U = $('fakeUI'); $('fakeQ').textContent = T('She looks fine. She sounds fine. Is this her?', '她看起来没事，听起来也没事。这是她吗？'); $('fakeTest').innerHTML = `<span class="en">Lena, raise two fingers and say "blue umbrella"</span><span class="zh">Lena，举两根手指，说“蓝伞”</span>`; $('fakeHang').textContent = T('Hang up', '挂断'); U.hidden = false;
  await new Promise(res => { $('fakeHang').onclick = () => { U.hidden = true; res(); }; $('fakeTest').onclick = async () => { U.hidden = true; await playClip(SRC('media/END_TEST.mp4'), [[.2, 4.2, "I'm fine. Don't send anyone.", '我没事，别叫人来。']]); $('black').classList.add('on'); $('black').textContent = T('She never raised her fingers.', '她没有举手指。她又推了一次杯子。'); AE.play('stinger', .9); await sleep(2600); $('black').textContent = ''; res(); }; }); }
async function endFlow(id){ const E = STORY.endings[id] || STORY.endings.gas; closed = E; mem.runs++; mem.last = E.title.zh; held.forEach(x => { if (!mem.known.includes(x)) mem.known.push(x); }); if (!mem.endings.includes(id)) mem.endings.push(id); memSave(); tell({ev: 'ending', id, title: E.title}); $('sheet').classList.remove('show'); showSub(null);
  const fail = ['gas', 'door', 'caught', 'handed'].includes(id); const from = clock; const lines = {gas: T('The doors on B2 and B3 have sealed.', 'B2、B3 的门封死了。气体开始释放。'), door: T('She never left the room.', '她一直没能离开那个房间。'), caught: T('He cut the line. The test ran on time.', '他切断了线路。测试准时开始。'), handed: T('The test ran on time.', '测试准时开始。'), escaped: T('The gas fired on empty floors. She is outside.', '楼下空放了一场气。她在楼外。'), truth: T('The gas fired on empty floors. She is outside.', '楼下空放了一场气。她在楼外。')};
  RT.clear(); await midnight(from, lines[id]); clock = 0; $('tc').hidden = true; RT.clear(); if (fail) await fakeCall(); else if (id === 'escaped'){ $('mid').hidden = true; showPip(9, 'confess'); await sleep(7000); } else { AE.bgm('reveal', .35); }
  $('mid').hidden = true; $('black').classList.remove('on'); RT.clear(); const K2 = Object.keys(STORY.endings); $('endK').textContent = T(`Ending ${mem.endings.length} of ${K2.length} found`, `已解锁结局 ${mem.endings.length} / ${K2.length}`); $('endT').textContent = T(E.title.en, E.title.zh); $('endEn').textContent = E.text.en; $('endZh').textContent = E.text.zh; $('endZh').hidden = lang === 'en';
  const miss = []; if (id !== 'truth'){ if (!held.includes('E05')) miss.push(T('Who locked the door? The terminal in her room knows.', '门是谁锁的？她房间里的终端有记录。')); if (!held.includes('E09')) miss.push(T('Lena is hiding something. You never made her say it.', 'Lena 瞒着一件事，你还没逼她说出来。')); if (!held.includes('E10')) miss.push(T('You never saw the floor below her.', '你还没看过她楼下那一层。')); if (!held.includes('E13')) miss.push(T('Nothing yet names who pressed play. Try the control room.', '还没有东西能指认谁按的播放。去控制室。')); if (place !== '楼外') miss.push(T('The way out is the roller door. It wants a code you have already seen.', '唯一的出口是卷帘门，要一组你已经见过的数字。')); }
  $('endMiss').innerHTML = miss.slice(0, 3).map(esc).join('<br>');
  $('endGal').innerHTML = K2.sort((a, b) => STORY.endings[a].order - STORY.endings[b].order).map(k => { const got = mem.endings.includes(k); return `<div class="${k === id ? 'now' : got ? 'got' : ''}">${got ? '●' : '○'} ${got ? esc(T(STORY.endings[k].title.en, STORY.endings[k].title.zh)) : '? ? ?'}</div>`; }).join('');
  $('endMeta').textContent = T(`${held.length} pieces of evidence · ${round} moves`, `拿到 ${held.length} 份证据 · 走了 ${round} 步`);
  $('endAgain').textContent = T('Back to 23:24. You keep what you know', '回到 23:24，带着你知道的重来');
  const back = ckpts.length >= 3 ? ckpts[ckpts.length - 3] : null; const B = $('endBack'); B.hidden = !back || !fail; if (back){ B.dataset.round = back.round; B.textContent = T(`Or go back to ${clockStr(back.clock)} and choose again`, `或者回到 ${clockStr(back.clock)}，重新选`); }
  $('endCard').hidden = false; waitMusic(true); }
// 回看和重来时恢复计时条
const _showTc = () => { $('tc').hidden = false; }; $('endAgain').addEventListener('click', _showTc); $('endBack').addEventListener('click', _showTc); $('mRestart').addEventListener('click', _showTc);
})();
