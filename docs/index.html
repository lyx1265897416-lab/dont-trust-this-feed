let next = null;
const applyLang = () => {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'; document.body.classList.toggle('lang-en', lang === 'en');
  document.querySelectorAll('[data-en]').forEach(el => el.textContent = el.dataset[lang]);
  $('title').innerHTML = T('Don\'t trust <em>this feed</em>', '别信<em>这段直播</em>');
  $('dTitle').textContent = T('Case file', '案卷');
  $('hintBtn').textContent = T('Stuck? Ask what\'s missing', '卡住了？问 Lin 还缺什么');
  document.querySelectorAll('[data-en-ph]').forEach(el => el.placeholder = lang === 'zh' ? el.dataset.zhPh : el.dataset.enPh);
  $('mLangV').textContent = lang === 'en' ? 'English' : 'Chinese';
  if (next && document.body.classList.contains('choosing')) fillChoice();
};
applyLang();
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const dual = o => o ? `${esc(o.en)}<span class="zh">${esc(o.zh)}</span>` : '';
const setMode = m => { document.body.classList.remove('start', 'choosing', 'playing', 'waiting'); document.body.classList.add(m); };
setMode('start');
$('stage').style.background = '#000 url(media/poster.jpg) center/cover';
const chip = $('liveChip'); const setChip = h => { chip.innerHTML = h; chip.hidden = !h; };
function toast(t){ const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }
const subs = $('subs');
function showSub(c){ if (!c){ subs.innerHTML = ''; return; } const who = c.who && (c.who === 'Unknown' ? T('Unknown', '未知说话者') : c.who); subs.innerHTML = (who ? `<div class="who">${esc(who)}</div>` : '') + `<div class="en">${esc(c.en)}</div>` + (c.zh ? `<div class="zh">${esc(c.zh)}</div>` : ''); }
function placeSubs(){ subs.style.bottom = document.body.classList.contains('choosing') ? ($('sheet').offsetHeight + 14) + 'px' : ''; }
addEventListener('resize', placeSubs);

// 信号来源：画面从哪一路来，永远标清楚
let verified = false;
const SRC_LABEL = {
  memo: () => ['--relay', 'VOICE MEMO', 'Lin · 23:02'],
  relay: () => ['--relay', 'CENTER RELAY', 'LIVE?'],
  freeze: () => ['--relay', 'CENTER RELAY', 'LIVE?'],
  direct: () => ['--direct', 'DIRECT', verified ? 'Lin · verified live' : 'Lin · unverified'],
  '当面': () => ['--direct', 'IN PERSON', 'Lin'],
  '前置': () => SRC_LABEL.direct(), '后置': () => ['--direct', 'DIRECT', 'rear camera'], '来电': () => ['--chen', 'OPS LINE', 'Chen Cen']
};
function setSrc(k){ if (!k){ $('src').hidden = true; return; } const f = SRC_LABEL[k] || SRC_LABEL.direct, [c, a, b] = f(); const el = $('src'); el.hidden = false; el.style.setProperty('--c', `var(${c})`); $('srcA').textContent = a; $('srcB').textContent = b; }

function bubble(who, c, you){ const el = document.createElement('div'); el.className = 'bub' + (you ? ' you' : ''); el.innerHTML = `<small>${esc(who)}</small>${esc(c.en)}${c.zh && c.zh !== c.en ? `<span class="zh">${esc(c.zh)}</span>` : ''}`; $('bubbles').appendChild(el); setTimeout(() => el.remove(), 4200); }

// 案卷：证据只有这些原文，来自资料包；画面里没有字
let held = [], goal = null;
function evCardHtml(e, kicker){ return `<div class="ek">${esc(kicker)}</div><div class="et">${esc(T(e.title.en, e.title.zh))}</div><div class="ef">${dual(e.fact)}</div><div class="el">${dual(e.limit)}</div>`; }
function gain(id, quiet){ if (!EV[id] || held.includes(id)) return; held.push(id); if (id === 'E03') verified = true; $('caseN').textContent = held.length; $('caseBtn').hidden = false; if (quiet) return; const b = $('caseBtn'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
  const el = $('ev'); el.innerHTML = evCardHtml(EV[id], T('New evidence · ' + id, '新证据 · ' + id)); el.hidden = false; clearTimeout(gain.t); gain.t = setTimeout(() => el.hidden = true, id === 'E01' ? 3000 : 5200); }
function showPip(d){ const v = $('pipV'); if (!v.src) v.src = SRC('media/clip.mp4'); v.currentTime = 0; v.play().catch(() => {}); $('pip').hidden = false; document.body.classList.add('haspip'); clearTimeout(showPip.t); showPip.t = setTimeout(() => { $('pip').hidden = true; document.body.classList.remove('haspip'); v.pause(); }, d * 1000); }
function renderCase(){
  const L = $('dList'); let h = goal ? `<div class="dtask"><div class="ek">${esc(T('Right now', '现在要查清'))}</div>${dual(goal)}</div>` : '';
  h += held.length ? held.map(id => { const e = EV[id]; return `<div class="ecard">${evCardHtml(e, id)}${e.clip ? `<button class="ebtn" data-cmp="${id}">${esc(T('Compare the two plays', '对照两次播放'))}</button><div class="ecmp" id="cmp${id}" hidden></div>` : ''}</div>`; }).join('') : `<div class="none">${esc(T('Nothing yet.', '还没有。'))}</div>`;
  L.innerHTML = h;
  L.querySelectorAll('[data-cmp]').forEach(b => b.onclick = () => { const box = $('cmp' + b.dataset.cmp); box.hidden = false; const src = SRC('media/clip.mp4'); box.innerHTML = `<video src="${src}" playsinline muted></video><video src="${src}" playsinline></video><small>${esc(T('First play · second play. Same frames, same sound.', '第一次 · 第二次。同样的画面，同样的声音。'))}</small>`; const [x, y] = box.querySelectorAll('video'); x.play().catch(() => {}); y.play().catch(() => {}); b.remove(); });
}
$('caseBtn').onclick = $('endFile').onclick = () => { if (!front.paused) { front.pause(); $('drawer').dataset.resume = 1; } renderCase(); $('drawer').hidden = false; };
$('dClose').onclick = () => { $('drawer').hidden = true; $('dList').innerHTML = ''; if ($('drawer').dataset.resume){ delete $('drawer').dataset.resume; front.play().catch(() => {}); } };

function show(el){ const old = front; front = el; el.classList.add('on'); const retire = () => { if (old !== front){ old.classList.remove('on'); old.pause(); } }; requestAnimationFrame(retire); setTimeout(retire, 60); }
function spare(){ return pool.find(v => v !== front && !v.dataset.keep) || pool.find(v => v !== front); }
function load(el, src, loop){ el.loop = !!loop; el.muted = !!loop; el.src = src; el.load(); }

let sid = null, round = 0, busy = false, closed = null;
async function api(path, body){ await relayReady; const r = await fetch(API + path, {method: body ? 'POST' : 'GET', headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(Object.assign({k: K}, body)) : undefined}); const raw = await r.text(); let j; try { j = JSON.parse(raw); } catch (e){ throw new Error(T('The server hiccuped. Please send again.', '服务刚才没响应，请再发一次')); } if (!r.ok) throw new Error(j.err || r.status); return j; }
(K ? relayReady.then(() => fetch(`${API}/api/ping?k=${encodeURIComponent(K)}`)) : Promise.reject(new Error('nokey'))).then(r => r.json()).then(j => setChip(!j.ok ? '<b>Wrong key</b> · open this page from the test link' : j.vivix_balance === 'insufficient' ? '<b>Vivix balance low</b> · top up the Vivix workspace first' : `<b>Live generation connected</b> · ${esc(j.model)} · auto length · director ${esc((j.director || '').split('/').pop())}`))
  .catch(e => setChip(e.message === 'nokey' ? '<b>Preview</b> · opening only; live scenes need the test link with a key' : '<b>Live generation offline</b> · the relay on the Mac is not reachable right now'));

const ov = pool[1]; load(ov, SRC('media/OPEN.mp4')); const idle = pool[2]; load(idle, SRC('media/IDLE0.mp4'), true);
async function startSession(){ held = []; goal = null; verified = false; closed = null; $('caseN').textContent = '0'; $('caseBtn').hidden = true; if (!K){ next = PREVIEW_NEXT; return; } const j = await api('/api/session', {mode: MODE}); sid = j.sid; next = j.next; round = 0; }
$('startBtn').onclick = async () => {
  $('startCard').hidden = true; setMode('playing');
  [pool[0], idle].forEach(v => { const p = v.play(); if (p) p.then(() => { if (v !== front) v.pause(); }).catch(() => {}); });
  wait.play().then(() => { if (!waitTarget) wait.pause(); }).catch(() => {});
  startSession().catch(e => setChip('<b>Could not start</b> · ' + esc(e.message)));
  await uiReady; playOpening();
};
let replayFn = null;
function playOpening(){
  showSub(null); ov.currentTime = 0; ov.muted = false; ov.loop = false; const fired = new Set();
  RT.begin({key: 'OPEN', parts: [{v: ov, d: UI.total}]}); replayFn = playOpening;
  ov.play().then(() => show(ov)).catch(() => { show(ov); toast(T('Tap the screen to start', '点一下画面开始')); });
  ov.ontimeupdate = () => { const t = ov.currentTime; const c = UI.cues.find(q => t >= q.s && t <= q.e); showSub(c || null); const s = UI.src.find(q => t >= q.s && t < q.e); if (s) setSrc(s.src);
    UI.msgs.forEach((m, i) => { if (t >= m.at && !fired.has('m' + i)){ fired.add('m' + i); bubble('Lin', m); } });
    UI.evidence.forEach(e => { if (t >= e.at && !fired.has(e.id)){ fired.add(e.id); gain(e.id); } }); };
  ov.onended = () => { RT.done('OPEN'); RT.clear(); ov.ontimeupdate = null; idle.currentTime = 0; idle.play().catch(() => {}); show(idle); setSrc('direct'); openChoice(); };
}
$('mRestart').onclick = () => { $('menu').hidden = true; replayFn = null; closeChoice(); $('liveWait').hidden = true; $('endCard').hidden = true; liveRun++; busy = false; setMode('playing'); startSession().catch(() => {}); load(idle, SRC('media/IDLE0.mp4'), true); playOpening(); };
$('endAgain').onclick = () => $('mRestart').click();
$('menuBtn').onclick = () => { const m = $('menu'); m.hidden = !m.hidden; };
$('mLang').onclick = () => { lang = lang === 'en' ? 'zh' : 'en'; Q.set('lang', lang); history.replaceState(null, '', '?' + Q.toString()); applyLang(); $('menu').hidden = true; };

const opt = o => `<span class="en">${esc(o.en)}</span><span class="zh">${esc(o.zh)}</span>`;
async function openChoice(){
  setMode('choosing'); $('shade').classList.add('deep'); waitMusic(true); RT.clear();
  $('replayBtn').hidden = !replayFn; $('replayBtn').textContent = T('Replay', '重看这一段');
  for (let i = 0; i < 100 && !next; i++) await new Promise(r => setTimeout(r, 100));
  if (!next){ setChip('<b>No options received</b> · the local relay did not respond'); return; }
  fillChoice();
  $('optA').onclick = () => liveRound('option', 'A', next.A); $('optB').onclick = () => liveRound('option', 'B', next.B);
  $('sayIn').value = ''; $('sayBtn').disabled = false;
  setTimeout(() => { $('sheet').classList.add('show'); placeSubs(); }, 150);
}
function fillChoice(){
  $('rno').textContent = T(`Move ${round + 1}`, `第 ${round + 1} 步`);
  $('task').innerHTML = goal ? dual(goal) : '';
  $('cue').innerHTML = next.cue ? `${esc(next.cue.en)}<span class="zh">${esc(next.cue.zh)}</span>` : '';
  $('optA').innerHTML = opt(next.A); $('optB').innerHTML = opt(next.B);
}
$('replayBtn').onclick = () => { if (!replayFn || busy) return; closeChoice(); $('shade').classList.remove('deep'); waitMusic(false); setMode('playing'); replayFn(); };
$('hintBtn').onclick = () => { if (!busy) liveRound('free', null, {zh: '我卡住了。我们现在还缺什么？', en: "I'm stuck. What are we still missing?"}); };
function closeChoice(){ $('sheet').classList.remove('show'); subs.style.bottom = ''; $('shade').classList.remove('deep'); }
$('say').addEventListener('submit', e => { e.preventDefault(); const raw = $('sayIn').value.trim(); if (!raw || busy) return; liveRound('free', null, {zh: raw, en: raw}); });

let liveRun = 0;
async function liveRound(kind, choice, said){
  if (!K){ toast(T('Live scenes need the test link with a key', '实时生成需要带口令的测试链接')); return; }
  if (busy) return; busy = true; const my = ++liveRun, t0 = Date.now(); let r = null, rid = null;
  closeChoice(); setMode('waiting'); waitMusic(true); showSub(null);
  const herLine = lang === 'en' ? (said.en || said.zh) : (said.zh || said.en);
  $('lwH').textContent = T('You: ', '你：') + herLine;
  const phase = () => !r ? T('Sending to Lin…', '正在发给 Lin…') : r.status === 'submitted' ? T('Lin got it…', 'Lin 收到了…') : r.status === 'error' ? T('The line dropped', '信号断了')
    : (r.segs && r.segs[0] && r.segs[0].url && r.segs[1] && !r.segs[1].url) ? T('Connecting the picture…', '画面接通中…') : T('Waiting for her camera…', '等她的画面…');
  const hold = (label, cond) => new Promise(res => { $('liveWait').hidden = false; (function f(){ if (my !== liveRun) return; $('lwT').textContent = ((Date.now() - t0) / 1000).toFixed(1); $('lwS').textContent = label || phase(); if (cond()){ res(); } else setTimeout(f, 100); })(); });
  try { rid = (await api('/api/round', {sid, kind, choice, input: kind === 'free' ? said.zh : undefined})).id; }
  catch (e){ $('liveWait').hidden = true; busy = false; setChip('<b>Not sent</b> · ' + esc(e.message)); toast(T('Live generation unavailable', '实时生成不可用')); openChoice(); if (kind === 'free') $('sayIn').value = said.zh; return; }
  const V = [spare()]; V[0].dataset.keep = 1; V.push(spare()); delete V[0].dataset.keep;
  const poll = setInterval(async () => {
    try { r = await api(`/api/round/${rid}?k=${encodeURIComponent(K)}`); } catch (e) {}
    if (r && r.segs) r.segs.forEach((s, i) => { if (s.url && V[i].dataset.src !== s.url){ V[i].dataset.src = s.url; load(V[i], s.url); } });
  }, 500);
  const LOCAL = location.hostname === '127.0.0.1', M = LOCAL ? 1.5 : 3.0;
  const segErr = () => r && r.segs && r.segs.some(s => s.status === 'error');
  const seg1Ok = () => r && r.segs && r.segs[0] && r.segs[0].url && V[0].dataset.src === r.segs[0].url && V[0].readyState >= 3;
  const seg2Soon = () => { const s2 = r.segs[1]; if (!s2 || s2.url) return true; const d1 = V[0].duration || r.segs[0].dur || 5; return s2.eta_left != null && s2.eta_left <= d1 - M - (s2.dur >= 15 ? 1.5 : 0); };
  await hold(null, () => (r && r.status === 'error') || segErr() || (seg1Ok() && seg2Soon()));
  if (my !== liveRun){ clearInterval(poll); return; }
  const view = {};
  if (!segErr() && r.status !== 'error'){
    $('liveWait').hidden = true; waitMusic(false); setMode('playing'); setSrc('direct');
    bubble(T('You', '你'), said, true);
    view.play_at = Date.now(); view.seg2_eta = r.segs[1] ? r.segs[1].eta_left : null;
    RT.begin({key: 'round:' + rid, mix: r.mix, parts: r.segs.map((x, i) => ({v: V[i], d: x.dur || x.seconds})), label: T(`Move ${round + 1}`, `第 ${round + 1} 步`)}); RT.part(0);
    await play(0); view.seg1_end = Date.now();
    const ok2 = () => segErr() || (r.segs[1].url && V[1].dataset.src === r.segs[1].url && V[1].readyState >= 3);
    if (!ok2()){ waitMusic(true); while (!ok2() && my === liveRun) await new Promise(res => setTimeout(res, 100)); waitMusic(false); }
    view.stall = (Date.now() - view.seg1_end) / 1000;
    if (my === liveRun && !segErr()){ RT.part(1); await play(1); RT.done('round:' + rid); }
  }
  clearInterval(poll); view.end_at = Date.now(); $('liveWait').hidden = true;
  if (rid) api(`/api/round/${rid}/view`, view).catch(() => {});
  const gen = r.segs && r.segs.every(s => s.ready_at) ? Math.max(...r.segs.map(s => s.ready_at - r.director_at)) / 1000 : null;
  const dir = r.director_at ? (r.director_at - r.at) / 1000 : null;
  busy = false;
  if (!view.play_at || segErr()){ const low = (r.segs || []).some(s => s.err_code === 10005); setChip(low ? '<b>Vivix balance low</b> · this scene was not generated (10005). Top up, then send again' : `<b>This scene failed</b> · ${esc((r.segs || []).map(s => s.err).filter(Boolean)[0] || r.err || '')} · you can choose again`); openChoice(); return; }
  (r.evidence_cues || []).forEach(e => gain(e.id, true));
  if (r.open_question && r.open_question.en) goal = r.open_question;
  setChip(`<b>Move ${round + 1}</b> · ${esc(r.mode)} · send to play ${((view.play_at - t0) / 1000).toFixed(1)}s (director ${dir == null ? '—' : dir.toFixed(1)}s${r.director === 'prefetched' ? ' prefetched' : ''} + part 1 ${r.segs[0].ready_at ? ((r.segs[0].ready_at - r.director_at) / 1000).toFixed(1) : '—'}s, part 2 ${gen == null ? '—' : gen.toFixed(1)}s) · seam ${(view.stall || 0).toFixed(1)}s`);
  const sceneNo = round + 1;
  replayFn = () => {
    const go = (j, t) => { const v = V[j]; tick(j, v, new Set(['replay'])); v.currentTime = t; v.muted = false; v.loop = false; v.onended = () => { v.ontimeupdate = null; showSub(null); if (j + 1 < V.length){ RT.part(j + 1); go(j + 1, 0); } else { v.onended = null; RT.clear(); setSrc('direct'); openChoice(); } }; v.play().then(() => show(v)).catch(() => {}); };
    RT.begin({key: 'round:' + rid, mix: r.mix, free: true, parts: r.segs.map((x, i) => ({v: V[i], d: x.dur || x.seconds})), label: T(`Move ${sceneNo}`, `第 ${sceneNo} 步`), jump: (j, t) => { V.forEach(x => { if (x !== V[j]){ x.pause(); x.onended = null; x.ontimeupdate = null; } }); go(j, t); }});
    go(0, 0);
  };
  round++; next = r.next || next; setSrc('direct');
  if (r.case_closed){ closed = r.ending || {}; $('endT').textContent = T(held.includes('E13') ? 'It names him' : 'Out, not finished', held.includes('E13') ? '证据指向了他' : '人出来了，事还没完'); $('endEn').textContent = closed.en || ''; $('endZh').textContent = closed.zh || ''; $('endMeta').textContent = T(`${held.length} of ${Object.keys(EV).length} pieces of evidence · ${round} moves`, `拿到 ${held.length} / ${Object.keys(EV).length} 份证据 · ${round} 步`); $('endZh').hidden = lang === 'en'; RT.clear(); $('endCard').hidden = false; waitMusic(true); return; }
  openChoice();

  function tick(i, v, fired){
    const LT = (r.line_times || {})['seg' + (i + 1)] || [], ST = (r.src_times || {})['seg' + (i + 1)] || [], EC = (r.evidence_cues || []).filter(e => e.seg === i);
    const f = () => { const t = v.currentTime; const c = LT.find(x => t >= x.s && t <= x.e); showSub(c ? {en: c.en, zh: c.zh, who: c.who} : null); const s = ST.find(x => t >= x.s && t < x.e); if (s) setSrc(s.src); EC.forEach(e => { if (t >= e.at && !fired.has(e.id)){ fired.add(e.id); gain(e.id); } }); const rc = r.relay_cue; if (rc && rc.seg === i && t >= rc.at && !fired.has('pip')){ fired.add('pip'); showPip(rc.dur); } };
    v.ontimeupdate = f; return f;
  }
  function play(i){ return new Promise(res => {
    const v = V[i];
    v.currentTime = 0; v.muted = false; v.loop = false; let done = false;
    const end = () => { if (done) return; done = true; v.ontimeupdate = null; showSub(null); res(); };
    const f1 = tick(i, v, new Set());
    v.ontimeupdate = () => { if (my !== liveRun){ end(); return; } f1(); const d = v.duration || r.segs[i].seconds; if (d && v.currentTime >= d - 0.06) end(); };
    v.onended = end; v.onerror = end;
    v.play().then(() => show(v)).catch(() => { v.muted = true; v.play().then(() => show(v)).catch(end); });
  }); }
}
})();
</script>
